<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Availability — Layer Up Labs</title>
<meta name="theme-color" content="#e9ecf1">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css?v=42">
<style>
  .gate { padding: clamp(2rem, 10vh, 6rem) 0; }
  .gate__box { max-width: 380px; margin: 0 auto; display: grid; gap: 14px; text-align: center; }
  .gate__box h1 { font-size: 2rem; }
  .gate__box input { font: 600 1.6rem/1 var(--mono); letter-spacing: .4em; text-align: center; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
  .gate__box input:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .gate__box .admin-status { min-height: 1.2em; }
  .admin-status { font: 500 .8rem/1.4 var(--mono); color: var(--muted); margin: 0; }
  .admin-status.ok { color: #1a7f37; }
  .admin-status.err { color: #b42318; }
  .weekly { display: flex; flex-wrap: wrap; gap: 8px; }
  .weekly label { display: inline-flex; align-items: center; gap: 6px; font: 500 .8rem/1 var(--mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--card); }
  .weekly input { accent-color: #b42318; margin: 0; }
  .weekly label:has(input:checked) { background: #ffe3e3; border-color: #f2a6a6; color: #b42318; }
  .save-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="../../index.html">layer up<b>.</b>labs</a>
  <nav class="nav" aria-label="Main">
    <a href="../">Book page</a>
  </nav>
</div></header>

<div class="wrap gate" id="gate">
  <form class="tile gate__box" id="gate-form">
    <span class="label">Admin</span>
    <h1>Enter password</h1>
    <input id="gate-code" type="password" autocomplete="current-password" aria-label="Password" placeholder="&bull;&bull;&bull;&bull;" required>
    <button class="btn" type="submit" id="gate-btn">Unlock</button>
    <p class="admin-status err" id="gate-msg" aria-live="polite"></p>
  </form>
</div>

<main id="admin-main" hidden>
<div class="wrap"><div class="bento">

  <section class="tile head t12">
    <span class="label">Admin &middot; only for Emmet</span>
    <h1>Availability</h1>
    <p class="lede">Tap the days you can&rsquo;t shoot, then press Save. They show as unavailable on the booking calendar right away.</p>
  </section>

  <section class="tile t8">
    <div id="admin-cal"></div>
    <div class="cal__foot">
      <p class="cal__legend"><span class="key key--open"></span>Open <span class="key" style="background:#ffe3e3;border:1px solid #f2a6a6"></span>Unavailable</p>
      <p class="admin-status" id="count"></p>
    </div>
  </section>

  <section class="tile t4">
    <div class="tile-head">
      <span class="label">Every week</span>
      <h2>Always busy on</h2>
      <p>For days you can never shoot, like school days.</p>
    </div>
    <div class="weekly" id="weekly"></div>
  </section>

  <section class="tile t12">
    <div class="save-row">
      <button class="btn" id="save" type="button" disabled>Save changes</button>
      <button class="btn btn--ghost" id="revert" type="button" disabled>Undo changes</button>
      <button class="btn btn--ghost" id="lock" type="button">Lock</button>
      <p class="admin-status" id="status"></p>
    </div>
  </section>

</div></div>
</main>
<script src="../calendar.js?v=2"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const status = (text, kind = '') => { $('status').textContent = text; $('status').className = `admin-status ${kind}`; };
  const PASS_KEY = 'lul-admin-pass';
  const session = {
    get: () => { try { return sessionStorage.getItem(PASS_KEY) || ''; } catch (e) { return ''; } },
    set: (v) => { try { sessionStorage.setItem(PASS_KEY, v); } catch (e) {} },
    del: () => { try { sessionStorage.removeItem(PASS_KEY); } catch (e) {} },
  };
  const problems = {
    'wrong-password': 'Wrong password.',
    locked: 'Too many wrong tries. Wait 15 minutes and try again.',
    offline: 'Couldn’t reach the availability helper. Check your internet connection.',
    'not-set-up': 'The availability helper isn’t set up yet. Send Claude its web app link.',
    'bad-request': 'Something went wrong. Reload the page and try again.',
  };
  const explain = (r) => problems[r.error] || 'Something went wrong. Reload the page and try again.';

  let password = '';
  let saved = { weekdays: [], dates: [] };
  let current = saved;

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const refresh = (keepStatus = false) => {
    const dirty = !same(current, saved);
    $('save').disabled = !dirty;
    $('revert').disabled = !dirty;
    const n = current.dates.length;
    $('count').textContent = `${n} day${n === 1 ? '' : 's'} blocked` + (current.weekdays.length ? ' + weekly days' : '');
    if (dirty && !keepStatus) status('Unsaved changes. Press Save.');
  };

  const cal = LULCalendar.Calendar($('admin-cal'), {
    mode: 'admin',
    onChange: (v) => { current = v; refresh(); },
  });

  // Weekly checkboxes
  const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  $('weekly').innerHTML = names.map((n, i) => `<label><input type="checkbox" value="${i}"> ${n}</label>`).join('');
  $('weekly').addEventListener('change', () => {
    cal.setWeekdays([...$('weekly').querySelectorAll('input:checked')].map((c) => +c.value));
  });
  const showWeekly = (days) => $('weekly').querySelectorAll('input').forEach((c) => { c.checked = days.includes(+c.value); });

  const apply = (data) => {
    cal.setUnavailable(data);
    showWeekly(data.weekdays);
    current = cal.value();
    saved = current;
    refresh(true);
  };

  // The password is checked on Google's side, not in this page.
  async function unlock(pass, fromSession) {
    $('gate-btn').disabled = true;
    $('gate-msg').className = 'admin-status';
    $('gate-msg').textContent = 'Checking…';
    const r = await LULCalendar.adminCall({ action: 'check', password: pass });
    $('gate-btn').disabled = false;
    if (!r.ok) {
      session.del();
      $('gate-msg').className = 'admin-status err';
      $('gate-msg').textContent = fromSession && r.error === 'wrong-password' ? '' : explain(r);
      $('gate-code').value = '';
      $('gate-code').focus();
      return;
    }
    password = pass;
    session.set(pass);
    $('gate').hidden = true;
    $('admin-main').hidden = false;
    apply(r.data);
    status('Unlocked. Tap days to block them, then Save.', 'ok');
  }

  $('gate-form').addEventListener('submit', (e) => {
    e.preventDefault();
    unlock($('gate-code').value.trim(), false);
  });

  $('save').addEventListener('click', async () => {
    $('save').disabled = true;
    status('Saving…');
    const r = await LULCalendar.adminCall({ action: 'save', password, data: cal.value() });
    if (r.ok) {
      apply(r.data);
      status('Saved. The booking calendar is updated.', 'ok');
    } else {
      status(`Not saved. ${explain(r)}`, 'err');
      refresh(true);
    }
  });

  $('revert').addEventListener('click', () => { apply(saved); status('Changes undone.'); });

  $('lock').addEventListener('click', () => {
    if (!same(current, saved) && !confirm('You have unsaved changes. Lock anyway?')) return;
    password = '';
    session.del();
    current = saved;
    $('admin-main').hidden = true;
    $('gate').hidden = false;
    $('gate-msg').textContent = '';
    $('gate-code').focus();
  });

  addEventListener('beforeunload', (e) => { if (!same(current, saved)) e.preventDefault(); });

  if (!LULCalendar.ready()) $('gate-msg').textContent = problems['not-set-up'];
  const remembered = session.get();
  if (remembered) unlock(remembered, true);
  else $('gate-code').focus();
</script>
</body>
</html>
