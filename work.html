<template data-project="#illustration/frozen-peaks" data-title="Frozen Peaks — Layer Up Labs"><section class="tile head t12 project-intro"><div><h2>&ldquo;Frozen Peaks&rdquo;</h2><p class="lede">Digital artwork, shown at the Tampa Museum of Art.</p></div><div><span class="label">Details</span><ul class="facts" style="margin-bottom:0"><li><span>Medium</span><span>Digital art</span></li><li><span>Award</span><span>Honorable Mention, 2026</span></li></ul></div></section><section class="tile t12 photo"><img src="images/frozen-peaks.jpg" alt="Framed digital artwork of snow-covered pine trees in front of a sharp mountain peak under a cloudy sky" style="display:block;width:auto;max-width:100%;max-height:85vh;margin:0 auto;border-radius:14px"></section><section class="tile t12"><div class="tile-head"><h2>Artist statement</h2></div><p class="lede" style="margin:0;max-width:44rem">This piece explores realism through the detailed rendering of snowy trees and a sharp mountain landscape. I was inspired by online digital renders that blur the line between computer generated imagery and real photography. Using Blender, I originally planned this scene as a backdrop for a realistic railcar model, but as the environment developed, the landscape itself became strong enough to stand alone. I chose to keep the focus on the natural setting to highlight the textures, lighting, and atmosphere of that cold winter. When viewing this artwork, I want the audience to feel as if they&rsquo;re looking at a genuine photograph&mdash;one that brings back memories of cold, snowy winters and the quiet beauty found in nature.</p></section><section class="tile t8" style="display:flex;flex-direction:column;justify-content:space-between;gap:1.6rem"><span class="label">Award</span><div><h2>Honorable Mention</h2><p class="lede" style="margin:.6rem 0 0;max-width:44rem">14th Congressional District &amp; Next Generation High School Art Competition (2026). Award presented by U.S. Representative Kathy Castor; artwork exhibited at the Tampa Museum of Art.</p></div></section><section class="tile t4" style="padding:0"><img src="images/frozen-peaks-award.jpg" alt="Emmet smiling at a podium and holding a blue award folder, standing beside three other people in front of a glass building" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover"></section><section class="tile t12"><div class="tile-head"><h2>On display</h2><p>Hanging in the gallery at the Tampa Museum of Art.</p></div><img src="images/frozen-peaks-gallery.jpg" alt="&ldquo;Frozen Peaks&rdquo; hanging among other student artwork on a white gallery wall, with tall windows and a view of the city behind it" loading="lazy" style="display:block;width:100%;height:auto;border-radius:14px"></section><section class="tile t12"><div class="tile-head"><h2>Process</h2></div><div class="grid"><div class="thumb thumb--empty">Process photo coming soon</div><div class="thumb thumb--empty">Process photo coming soon</div><div class="thumb thumb--empty">Process photo coming soon</div></div></section></template>

<script>
  const tiles = document.querySelectorAll('.work-nav .work');
  const panel = document.getElementById('project');
  const templates = [...document.querySelectorAll('template[data-project]')];

  const link = (className, href, text) => {
    const a = document.createElement('a');
    a.className = className;
    a.href = href;
    a.textContent = text;
    return a;
  };

  const render = () => {
    const inHash = location.hash.slice(1).split('/')[0];
    const name = [...tiles].some((a) => a.hash === `#${inHash}`) ? inHash : 'printing';
    const projects = templates.filter((t) => t.dataset.project.startsWith(`#${name}/`));
    const current = projects.find((t) => t.dataset.project === location.hash) || projects[0];
    tiles.forEach((a) => a.hash === `#${name}` ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
    panel.replaceChildren(current.content.cloneNode(true));
    document.title = current.dataset.title;
    const category = [...tiles].find((a) => a.hash === `#${name}`).querySelector('b').textContent;
    const nav = document.createElement('nav');
    nav.className = 'tile t12 project-nav';
    nav.setAttribute('aria-label', `${category} projects`);
    nav.append(link('label', `#${name}`, category));
    if (projects.length > 1) {
      const btns = document.createElement('div');
      btns.className = 'btns';
      projects.forEach((t) => {
        const a = link('btn btn--ghost', t.dataset.project, t.content.querySelector('h2').textContent);
        if (t === current) a.setAttribute('aria-current', 'true');
        btns.append(a);
      });
      nav.append(btns);
    }
    panel.prepend(nav);
    panel.focus({ preventScroll: true });
  };

  const lightbox = document.querySelector('.lightbox');
  const track = lightbox.querySelector('.lightbox-track');
  const count = lightbox.querySelector('.lightbox-count');
  let shown = 0;
  let settle;
  const mark = (i) => {
    shown = i;
    count.textContent = `${i + 1} / ${track.children.length}`;
  };
  const go = (i, behavior) => {
    mark((i + track.children.length) % track.children.length);
    track.scrollTo({ left: shown * track.clientWidth, behavior });
  };
  // Gallery links still point at the full-size files, so they work without JavaScript.
  panel.addEventListener('click', (e) => {
    const a = e.target.closest('.gallery a');
    if (!a) return;
    e.preventDefault();
    const links = [...a.closest('.gallery').querySelectorAll('a')];
    track.replaceChildren(...links.map((l) => {
      const slide = document.createElement('div');
      const img = document.createElement('img');
      slide.className = 'lightbox-slide';
      img.src = l.href;
      img.alt = l.querySelector('img').alt;
      slide.append(img);
      return slide;
    }));
    lightbox.showModal();
    go(links.indexOf(a), 'instant');
  });
  lightbox.querySelector('.arrow--prev').addEventListener('click', () => go(shown - 1));
  lightbox.querySelector('.arrow--next').addEventListener('click', () => go(shown + 1));
  lightbox.querySelector('.lightbox-close').addEventListener('click', () => lightbox.close());
  lightbox.addEventListener('click', (e) => {
    if (e.target.classList.contains('lightbox-slide')) lightbox.close();
  });
  lightbox.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') go(shown - 1);
    if (e.key === 'ArrowRight') go(shown + 1);
  });
  lightbox.addEventListener('close', () => track.replaceChildren());
  // Swiping scrolls the track natively; update the count once it comes to rest.
  track.addEventListener('scroll', () => {
    clearTimeout(settle);
    settle = setTimeout(() => mark(Math.round(track.scrollLeft / track.clientWidth)), 100);
  });

  addEventListener('hashchange', render);
  render();
</script>
